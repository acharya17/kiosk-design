<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bistro — Sign In</title>
  <meta name="description" content="Sign in to your Bistro account to manage digital signage, ordering, and restaurant operations.">
  <link rel="stylesheet" href="css/variables.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* ─── Login Page Layout ─── */
    .login-page {
      display: flex;
      min-height: 100vh;
      background: var(--bg-admin-dark);
    }

    /* ─── Left Panel: Branding ─── */
    .login-brand-panel {
      width: 45%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 4rem;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #312e81 0%, #4f46e5 50%, #6366f1 100%);
    }

    .login-brand-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 80%, rgba(255,255,255,0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.04) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-brand-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        /* Subtle grid pattern */
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    /* Decorative shapes */
    .brand-shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.06;
      background: white;
    }
    .brand-shape-1 { width: 400px; height: 400px; top: -100px; right: -100px; }
    .brand-shape-2 { width: 300px; height: 300px; bottom: -80px; left: -80px; }
    .brand-shape-3 { width: 180px; height: 180px; top: 40%; right: 20%; opacity: 0.04; }

    .login-brand-content {
      position: relative;
      z-index: 1;
    }

    .login-brand-content h1 {
      font-family: var(--font-display);
      font-size: 2.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.75rem;
      letter-spacing: -0.5px;
    }

    .login-brand-content .brand-tagline {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.7);
      font-weight: 400;
      line-height: 1.6;
    }

    /* ─── Right Panel: Login Form ─── */
    .login-form-panel {
      width: 55%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      background: #fff;
    }

    .login-form-container {
      width: 100%;
      max-width: 420px;
    }

    .login-form-container h2 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-admin-main);
      margin-bottom: 0.5rem;
    }

    .login-form-container .login-subtitle {
      font-size: 0.95rem;
      color: var(--text-admin-muted);
      margin-bottom: 2rem;
    }

    /* ─── Form Fields ─── */
    .login-form .form-group {
      margin-bottom: 1.25rem;
    }

    .login-form .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-admin-main);
      margin-bottom: 0.5rem;
    }

    .login-form .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      font-family: var(--font-body);
      color: var(--text-admin-main);
      background: var(--bg-admin-dark);
      border: 1px solid var(--border-admin);
      border-radius: var(--radius-sm);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      outline: none;
    }

    .login-form .form-control::placeholder {
      color: var(--text-admin-muted);
      opacity: 0.7;
    }

    .login-form .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .login-form .form-control.has-error {
      border-color: var(--danger);
    }

    /* ─── Password Wrapper ─── */
    .pwd-wrapper {
      position: relative;
    }

    .pwd-wrapper .form-control {
      padding-right: 3rem;
    }

    .pwd-toggle-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-admin-muted);
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color var(--transition-fast);
    }

    .pwd-toggle-btn:hover {
      color: var(--text-admin-main);
    }

    /* ─── Forgot Password ─── */
    .forgot-password-link {
      display: block;
      text-align: right;
      font-size: 0.85rem;
      color: var(--primary);
      text-decoration: none;
      margin-top: 0.5rem;
      font-weight: 500;
      transition: color var(--transition-fast);
    }

    .forgot-password-link:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    /* ─── Error Messages ─── */
    .field-error {
      font-size: 0.8rem;
      color: var(--danger);
      margin-top: 0.35rem;
      display: none;
    }

    .login-error-banner {
      display: none;
      padding: 0.75rem 1rem;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: var(--radius-sm);
      color: var(--danger);
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      align-items: center;
      gap: 0.5rem;
    }

    /* ─── Submit Button ─── */
    .btn-sign-in {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.8rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: var(--font-body);
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background var(--transition-fast), box-shadow var(--transition-fast);
      margin-top: 1.75rem;
      gap: 0.5rem;
    }

    .btn-sign-in:hover:not(:disabled) {
      background: var(--primary-hover);
      box-shadow: var(--shadow-md);
    }

    .btn-sign-in:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* ─── Responsive ─── */
    @media (max-width: 1024px) {
      .login-brand-panel {
        width: 40%;
        padding: 3rem;
      }
      .login-form-panel {
        width: 60%;
      }
      .login-brand-content h1 {
        font-size: 2rem;
      }
    }

    @media (max-width: 768px) {
      .login-page {
        flex-direction: column;
      }
      .login-brand-panel {
        display: none;
      }
      .login-form-panel {
        width: 100%;
        min-height: 100vh;
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="login-page">
    <!-- Left: Branding Panel -->
    <div class="login-brand-panel">
      <div class="brand-shape brand-shape-1"></div>
      <div class="brand-shape brand-shape-2"></div>
      <div class="brand-shape brand-shape-3"></div>
      <div class="login-brand-content">
        <h1>Bistro</h1>
        <p class="brand-tagline">Digital Signage & Ordering</p>
      </div>
    </div>

    <!-- Right: Login Form -->
    <div class="login-form-panel">
      <div class="login-form-container">
        <h2>Welcome back</h2>
        <p class="login-subtitle">Sign in to continue to your account.</p>

        <!-- Error Banner -->
        <div class="login-error-banner" id="login-error-banner">
          <i data-lucide="circle-alert" style="width: 16px; height: 16px; flex-shrink: 0;"></i>
          <span>Invalid email or password. Please try again.</span>
        </div>

        <form class="login-form" id="login-form" novalidate>
          <!-- Email -->
          <div class="form-group">
            <label for="login-email">Email / Username</label>
            <input type="text" id="login-email" class="form-control" placeholder="Enter your email address" autocomplete="username">
            <div class="field-error" id="email-error">Email is required.</div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="pwd-wrapper">
              <input type="password" id="login-password" class="form-control" placeholder="Enter your password" autocomplete="current-password">
              <button type="button" class="pwd-toggle-btn" id="btn-toggle-pwd" aria-label="Show password">
                <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
              </button>
            </div>
            <div class="field-error" id="password-error">Password is required.</div>
            <a href="#" class="forgot-password-link" id="forgot-password-link">Forgot password?</a>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn-sign-in" id="btn-sign-in">
            Sign In
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Elements
    const emailInput = document.getElementById('login-email');
    const passwordInput = document.getElementById('login-password');
    const errorBanner = document.getElementById('login-error-banner');
    const emailError = document.getElementById('email-error');
    const passwordError = document.getElementById('password-error');
    const btnSignIn = document.getElementById('btn-sign-in');
    const btnTogglePwd = document.getElementById('btn-toggle-pwd');
    let isPasswordVisible = false;

    // Password toggle
    btnTogglePwd.addEventListener('click', () => {
      isPasswordVisible = !isPasswordVisible;
      passwordInput.type = isPasswordVisible ? 'text' : 'password';
      btnTogglePwd.innerHTML = isPasswordVisible
        ? '<i data-lucide="eye-off" style="width: 18px; height: 18px;"></i>'
        : '<i data-lucide="eye" style="width: 18px; height: 18px;"></i>';
      lucide.createIcons();
    });

    // Clear error states on input
    emailInput.addEventListener('input', () => {
      emailInput.classList.remove('has-error');
      emailError.style.display = 'none';
      errorBanner.style.display = 'none';
    });
    passwordInput.addEventListener('input', () => {
      passwordInput.classList.remove('has-error');
      passwordError.style.display = 'none';
      errorBanner.style.display = 'none';
    });

    // Forgot password
    document.getElementById('forgot-password-link').addEventListener('click', (e) => {
      e.preventDefault();
      alert('Forgot password functionality will be available in a future release.');
    });

    // Credential map (password not exposed in UI)
    const ACCOUNTS = {
      'kiosk1@gmail':  { password: 'Bistro@123', role: 'admin',   redirect: 'admin.html?auth=true' },
      'kiosk2@gmail':  { password: 'Bistro@123', role: 'kiosk',   redirect: 'kiosk.html?auth=true' },
      'kiosk3@gmail':  { password: 'Bistro@123', role: 'display', redirect: 'tv.html?auth=true' },
    };

    // Form submission
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();

      // Reset
      emailInput.classList.remove('has-error');
      passwordInput.classList.remove('has-error');
      emailError.style.display = 'none';
      passwordError.style.display = 'none';
      errorBanner.style.display = 'none';

      const email = emailInput.value.trim();
      const pass = passwordInput.value;

      // Validate empty fields
      let hasError = false;
      if (!email) {
        emailInput.classList.add('has-error');
        emailError.style.display = 'block';
        hasError = true;
      }
      if (!pass) {
        passwordInput.classList.add('has-error');
        passwordError.style.display = 'block';
        hasError = true;
      }
      if (hasError) return;

      // Loading state
      btnSignIn.disabled = true;
      btnSignIn.textContent = 'Signing in...';

      // Simulate auth delay
      setTimeout(() => {
        const account = ACCOUNTS[email];
        if (account && account.password === pass) {
          sessionStorage.setItem('kiosk_auth', account.role);
          window.location.href = account.redirect;
        } else {
          errorBanner.style.display = 'flex';
          passwordInput.value = '';
          btnSignIn.disabled = false;
          btnSignIn.textContent = 'Sign In';
        }
      }, 800);
    });

    // Init icons
    lucide.createIcons();
  </script>

</body>
</html>
